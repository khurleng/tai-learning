    <section class="lesson-head" aria-labelledby="page-title">
      <span class="eyebrow">LEARN SHAN</span>
      <h1 id="page-title">{{title}}</h1>
      <p>{{intro}}</p>
    </section>
    <div class="lesson-tools">
      <input id="lessonSearch" type="search" placeholder="Find in this lesson…" aria-label="Search lesson">
      <button type="button" class="primary" id="listenAll">Listen to all</button>
      <button type="button" class="secondary" id="stopAudio">Stop</button>
    </div>
    <div id="lessonGrid" class="lesson-grid"></div>
{{extra}}
