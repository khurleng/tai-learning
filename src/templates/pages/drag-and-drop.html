<section class="lesson-head">
  <span class="eyebrow">LEARN THROUGH PLAY</span>
  <h1>Match the letters</h1>
  <p>Drag a Shan letter to its sound. On a phone or keyboard, select a letter and then its matching sound.</p>
</section>
<section class="panel">
  <div class="section-heading">
    <h2>Drag and Drop Game</h2>
    <span id="gameScore">0 / 5 matched</span>
  </div>
  <div id="gameLetters" class="game-letters" aria-label="Letters to match">
  </div>
  <div id="gameTargets" class="game-targets" aria-label="Sound targets">
  </div>
  <p id="gameFeedback" role="status" aria-live="polite">Select a letter to begin.</p>
  <button id="newGame" class="primary">New round</button>
</section>
